[package]
name = "hh-bot"
version = "0.1.0"
description = "HH-bot — помощник в поиске работы на hh.ru"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webbrowser = "1"
chrono = "0.4"

[profile.release]
strip = true
lto = true
